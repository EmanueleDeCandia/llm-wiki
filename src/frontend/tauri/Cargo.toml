[package]
name = "llm-wiki-desktop"
version = "0.1.0"
description = "LLM Wiki Desktop — shell Tauri (packaging successivo)"
authors = ["LLM Wiki"]
edition = "2021"

# Shell desktop opzionale: l'applicazione è pienamente funzionante in
# modalità Web + sidecar FastAPI (pnpm dev). Questa crate avvia la GUI e,
# in sviluppo, la dev-server Vite; in produzione imballa dist/.
#
# Integrazione sidecar Python (fase successiva): usare tauri-plugin-shell
# per eseguire `python run.py` come processo sidecar locale e collegarlo
# via IPC a 127.0.0.1:8100.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "llm_wiki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
